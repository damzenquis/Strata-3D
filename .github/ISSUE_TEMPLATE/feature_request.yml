name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For UI changes, a sketch or mock-up is very welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
