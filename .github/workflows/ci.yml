name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate test models
        run: |
          pip install numpy pillow
          npm install --prefix .tools --no-audit --no-fund @gltf-transform/cli@4.5.1
          GLTF_TRANSFORM=.tools/node_modules/.bin/gltf-transform \
          MESHOPTIMIZER_DIR=.tools/node_modules/meshoptimizer \
          python tools/generate_test_models.py

      - name: Unit tests
        run: ./gradlew testDebugUnitTest -Pstrata.withoutReconTools=true

      - name: Build debug APK
        # The native reconstruction tools take over an hour to build and are not committed (tools/recon), so CI
        # checks the app without them.
        run: ./gradlew assembleDebug -Pstrata.withoutReconTools=true

      - name: Upload test-model report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-model-report
          path: app/build/reports/test-models.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: strata-3d-debug
          path: app/build/outputs/apk/debug/*.apk
